<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>設定カンパ SLOT v2</title>
<style>
:root{--bg:#07090d;--panel:#111722;--panel2:#171f2d;--text:#f7f8fb;--muted:#97a3b7;--gold:#ffd34d;--cyan:#3fe2ff;--red:#ff4d66;--green:#79e29a;--line:#2a3549}
*{box-sizing:border-box} html,body{margin:0;background:#05070b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;min-height:100vh}.app{width:min(100vw,700px);padding:10px 10px 36px;background:radial-gradient(circle at top,#172033 0,#090d14 45%,#05070b 100%)}
header{text-align:center;padding:4px 0 8px} h1{margin:2px 0;font-size:clamp(24px,7vw,38px);letter-spacing:.05em} .sub{color:var(--muted);font-size:12px}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.hud>div,.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center}.hud small,.stat small{display:block;color:var(--muted);font-size:10px}.hud b,.stat b{font-size:15px}
.machine{border:3px solid #3b465d;border-radius:20px;padding:11px;background:linear-gradient(#151d2a,#0c121b);box-shadow:0 0 30px #3fe2ff18;overflow:hidden}.marquee{text-align:center;font-weight:900;padding:7px;border-radius:9px;background:linear-gradient(90deg,#2c192f,#3b3114,#11323a);letter-spacing:.08em;margin-bottom:10px}
.reel-window{position:relative;background:#f7f3e8;border:6px solid #c99a00;border-radius:10px;padding:5px;overflow:hidden;box-shadow:inset 0 0 18px #0004}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:300px}.reel{position:relative;overflow:hidden;background:#fff;border:3px solid #111;border-radius:3px}.strip{position:absolute;left:0;right:0;top:-110px;will-change:transform}.symbol{height:100px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #ddd;font-weight:900;font-size:clamp(30px,9vw,52px);background:linear-gradient(#fff,#f6f6f2)}
.symbol.seven{color:#e22;font-style:italic;text-shadow:2px 2px #ffd34d}.symbol.bar{font-size:22px;background:#e9e9e9;color:#111}.symbol.blue{color:#1b70d8}.symbol.bell{color:#dcae00}.symbol.cherry{color:#b40017}.symbol.melon{color:#009b56}.symbol.orb{color:#0b65c7}
.payline{position:absolute;left:3px;right:3px;top:50%;height:3px;background:#ff304f;box-shadow:0 0 10px #ff304f;z-index:5;pointer-events:none}.shade{position:absolute;inset:0;box-shadow:inset 0 70px 35px -30px #0005,inset 0 -70px 35px -30px #0005;pointer-events:none;z-index:4}
.message{min-height:54px;margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px;font-weight:800}.controls{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:900;background:linear-gradient(#ffe76d,#ffb20d);box-shadow:0 6px 0 #976500;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 2px 0 #976500}button:disabled{opacity:.45;transform:none}.secondary{background:#263247;color:#fff;box-shadow:none;font-size:14px;padding:12px}
.panel{margin-top:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}.panel h2{font-size:16px;margin:0 0 8px}.guess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.guess-grid button{padding:12px 6px;font-size:16px;background:#1e2a3c;color:#fff;box-shadow:none;border:1px solid #3b4964}.guess-grid button.correct{background:#1c6b3c}.guess-grid button.wrong{background:#6b2132}.guess-history{font-size:12px;line-height:1.6;color:#cdd5df;max-height:110px;overflow:auto;margin-top:7px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.table-wrap{overflow:auto}.prob-table,.hist-table{width:100%;border-collapse:collapse;font-size:11px;min-width:500px}.prob-table th,.prob-table td,.hist-table th,.hist-table td{border-bottom:1px solid #263247;padding:6px;text-align:center;white-space:nowrap}.prob-table th,.hist-table th{color:#aeb8c8;background:#101721;position:sticky;top:0}.history-box{max-height:210px;overflow:auto}
.good{color:var(--green)}.bad{color:#ff7588}.gold{color:var(--gold)}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted);line-height:1.45}.toast{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30}.toast.show{display:flex}.toast-card{width:min(88vw,430px);background:#101722;border:3px solid var(--gold);border-radius:22px;text-align:center;padding:24px 18px;box-shadow:0 0 50px #ffd34d66}.toast-card .big{font-size:38px;font-weight:1000;margin-bottom:8px}.toast-card .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.toast-card .actions button{box-shadow:none;padding:12px;font-size:15px}.toast-card .actions .no{background:#303a4d;color:#fff}
@media (max-width:430px){.reels{height:270px}.symbol{height:90px}.strip{top:-100px}.hud{grid-template-columns:repeat(5,1fr)}.hud b{font-size:13px}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><h1>設定カンパ SLOT</h1><div class="sub">固定リール配列 × 設定1〜6看破ゲーム</div></header>
<div class="hud">
 <div><small>G</small><b id="games">0</b></div><div><small>BIG-A</small><b id="bigA">0</b></div><div><small>BIG-B</small><b id="bigB">0</b></div><div><small>REG</small><b id="reg">0</b></div><div><small>投入</small><b id="coins">0</b></div>
</div>
<div class="machine">
 <div class="marquee" id="marquee">設定は1〜6のどれか。見抜け。</div>
 <div class="reel-window"><div class="payline"></div><div class="reels"><div class="reel"><div class="strip" id="r0"></div></div><div class="reel"><div class="strip" id="r1"></div></div><div class="reel"><div class="strip" id="r2"></div></div></div><div class="shade"></div></div>
 <div class="message" id="message">STARTで1ゲーム</div>
 <div class="controls"><button id="startBtn">🎰 START / 次ゲーム</button></div>
</div>

<div class="panel"><h2>設定を回答</h2><div class="guess-grid" id="guessGrid"></div><div class="guess-history" id="guessHistory">まだ回答していません。</div></div>

<div class="panel"><h2>現在の観測値</h2><div class="stats-grid">
 <div class="stat"><small>BIG合算</small><b id="bigRate">-</b></div><div class="stat"><small>REG</small><b id="regRate">-</b></div><div class="stat"><small>ボーナス合算</small><b id="totalRate">-</b></div><div class="stat"><small>回答回数</small><b id="guessCount">0</b></div>
 </div><div class="tiny" style="margin-top:7px">下の確率表と見比べて、今回の台が良さそうか判断できます。</div></div>

<div class="panel"><h2>確定ボーナス確率</h2><div class="table-wrap"><table class="prob-table"><thead><tr><th>設定</th><th>BIG-A</th><th>BIG-B</th><th>BIG合算</th><th>REG</th><th>全ボーナス</th></tr></thead><tbody id="probBody"></tbody></table></div></div>

<div class="panel"><h2>これまでの設定履歴</h2><div class="tiny">正解して終了した台を端末内に保存します。今回の推移と比較する材料にできます。</div><div class="history-box"><table class="hist-table"><thead><tr><th>日時</th><th>設定</th><th>G</th><th>A</th><th>B</th><th>REG</th><th>回答</th></tr></thead><tbody id="histBody"></tbody></table></div><button class="secondary" id="clearHist">履歴を消去</button></div>
</div>

<div class="toast" id="toast"><div class="toast-card"><div class="big" id="toastTitle"></div><div id="toastText"></div><div class="actions" id="toastActions"></div></div></div>

<script>
const SYMBOLS={A:'7A',B:'7B',BAR:'BAR',BELL:'🔔',CHERRY:'🍒',MELON:'🍉',ORB:'🔵'};
// 画像の「縦につながったリール」を再現する固定配列。毎ゲームこの順番を上から回転させ、停止位置だけを決める。
const REELS=[
 [SYMBOLS.BELL,SYMBOLS.MELON,SYMBOLS.ORB,SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.MELON,SYMBOLS.A,SYMBOLS.CHERRY,SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.CHERRY,SYMBOLS.BAR,SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.MELON,SYMBOLS.ORB,SYMBOLS.BELL,SYMBOLS.A,SYMBOLS.CHERRY,SYMBOLS.ORB,SYMBOLS.BELL],
 [SYMBOLS.MELON,SYMBOLS.ORB,SYMBOLS.MELON,SYMBOLS.BELL,SYMBOLS.A,SYMBOLS.A,SYMBOLS.CHERRY,SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.MELON,SYMBOLS.BELL,SYMBOLS.BELL,SYMBOLS.MELON,SYMBOLS.CHERRY,SYMBOLS.ORB,SYMBOLS.BELL,SYMBOLS.BAR,SYMBOLS.BAR,SYMBOLS.BAR,SYMBOLS.ORB,SYMBOLS.BELL],
 [SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.MELON,SYMBOLS.MELON,SYMBOLS.BELL,SYMBOLS.CHERRY,SYMBOLS.A,SYMBOLS.ORB,SYMBOLS.BELL,SYMBOLS.MELON,SYMBOLS.MELON,SYMBOLS.BELL,SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.CHERRY,SYMBOLS.BAR,SYMBOLS.MELON,SYMBOLS.BELL,SYMBOLS.ORB,SYMBOLS.CHERRY,SYMBOLS.BELL]
];
// 設定差。BIGは2種類、REGは設定差を強めにして看破材料にする。
const PROBS={
 1:{a:1/455,b:1/682,r:1/455}, 2:{a:1/442,b:1/655,r:1/420}, 3:{a:1/431,b:1/630,r:1/380},
 4:{a:1/420,b:1/606,r:1/340}, 5:{a:1/410,b:1/585,r:1/300}, 6:{a:1/400,b:1/565,r:1/260}
};
const strips=[0,1,2].map(i=>document.getElementById('r'+i));
const el=id=>document.getElementById(id); let state={}; let busy=false; let audioCtx=null;
function symHTML(s){if(s==='7A')return '<span class="seven">7</span>';if(s==='7B')return '<span class="seven" style="color:#1a67df">7</span>';if(s==='BAR')return '<span class="bar">PYRAMID<br>BAR</span>';if(s==='🔔')return '<span class="bell">🔔</span>';if(s==='🍒')return '<span class="cherry">🍒</span>';if(s==='🍉')return '<span class="melon">🍉</span>';return '<span class="orb">🔵</span>'}
function buildStrips(){REELS.forEach((arr,ri)=>{const doubled=[...arr,...arr,...arr];strips[ri].innerHTML=doubled.map(s=>`<div class="symbol">${symHTML(s)}</div>`).join('')})}
function rate(n,g){return n?`1/${Math.round(g/n)}`:'-'}; function combined(...ps){return 1/ps.reduce((a,x)=>a+x,0)}
function initProbTable(){el('probBody').innerHTML=Object.entries(PROBS).map(([s,p])=>`<tr><td>${s}</td><td>1/${Math.round(1/p.a)}</td><td>1/${Math.round(1/p.b)}</td><td>1/${Math.round(combined(p.a,p.b))}</td><td>1/${Math.round(1/p.r)}</td><td>1/${Math.round(combined(p.a,p.b,p.r))}</td></tr>`).join('')}
function newMachine(){state={setting:1+Math.floor(Math.random()*6),games:0,a:0,b:0,r:0,guesses:[],positions:[0,0,0],startedAt:Date.now()}; busy=false; el('message').textContent='STARTで1ゲーム'; el('startBtn').disabled=false; update(); resetReelVisuals()}
function resetReelVisuals(){REELS.forEach((arr,i)=>{state.positions[i]=Math.floor(Math.random()*arr.length);setReel(i,state.positions[i],false)})}
function setReel(i,pos,animate=true){const h=window.innerWidth<=430?90:100; const base=REELS[i].length; const targetIndex=base+pos-1; const y=-(targetIndex*h); if(!animate){strips[i].style.transition='none';strips[i].style.transform=`translateY(${y}px)`;return} strips[i].style.transition=`transform ${0.85+i*0.28}s cubic-bezier(.12,.75,.18,1)`;strips[i].style.transform=`translateY(${y}px)`}
function pickOutcome(){const p=PROBS[state.setting],r=Math.random();if(r<p.a)return'A';if(r<p.a+p.b)return'B';if(r<p.a+p.b+p.r)return'R';return'N'}
function stopForOutcome(type){if(type==='A')return [6,4,6]; if(type==='B')return [17,5,6]; if(type==='R')return [11,16,15]; // middle-row aligned predefined bonus positions
 return REELS.map(a=>Math.floor(Math.random()*a.length)); }
function play(){if(busy)return;busy=true;el('startBtn').disabled=true;state.games++;const outcome=pickOutcome();const stops=stopForOutcome(outcome);el('message').textContent='リール回転中…'; // jump to earlier equivalent copy then animate forward
 REELS.forEach((arr,i)=>{const h=window.innerWidth<=430?90:100;const start=Math.max(0,stops[i]-8);strips[i].style.transition='none';strips[i].style.transform=`translateY(${-((arr.length+start-1)*h)}px)`;void strips[i].offsetHeight;setTimeout(()=>setReel(i,stops[i],true),30)});
 setTimeout(()=>{state.positions=stops;if(outcome==='A'){state.a++;el('message').innerHTML='<span class="gold">BIG-A BONUS!</span>';beepBonus(false)}else if(outcome==='B'){state.b++;el('message').innerHTML='<span class="gold">BIG-B BONUS!</span>';beepBonus(false)}else if(outcome==='R'){state.r++;el('message').innerHTML='<span class="good">REG BONUS!</span>';beepReg()}else el('message').textContent='ハズレ';busy=false;el('startBtn').disabled=false;update()},1500)}
function update(){el('games').textContent=state.games;el('bigA').textContent=state.a;el('bigB').textContent=state.b;el('reg').textContent=state.r;el('coins').textContent=state.games*3;el('bigRate').textContent=rate(state.a+state.b,state.games);el('regRate').textContent=rate(state.r,state.games);el('totalRate').textContent=rate(state.a+state.b+state.r,state.games);el('guessCount').textContent=state.guesses.length;el('guessHistory').innerHTML=state.guesses.length?state.guesses.map((g,i)=>`${i+1}回目：設定${g.value} → <span class="${g.correct?'good':'bad'}">${g.correct?'正解':'ハズレ'}</span>`).join('<br>'):'まだ回答していません。'}
function buildGuessButtons(){el('guessGrid').innerHTML='';for(let s=1;s<=6;s++){const b=document.createElement('button');b.textContent='設定 '+s;b.onclick=()=>guess(s);el('guessGrid').appendChild(b)}}
function guess(s){if(busy)return;const correct=s===state.setting;state.guesses.push({value:s,correct,time:Date.now()});update();if(correct){fanfare();saveSession();showToast('🎉 設定カンパ成功！',`正解は設定${state.setting}。${state.games}Gで看破しました。<br>BIG-A ${state.a} / BIG-B ${state.b} / REG ${state.r}`,true)}else{beepMiss();showToast('❌ ハズレ',`設定${s}ではありません。<br>前回までの回答は残したまま、続けて看破できます。`,false)}}
function showToast(title,text,correct){el('toastTitle').textContent=title;el('toastText').innerHTML=text;const a=el('toastActions');a.innerHTML='';if(correct){const yes=document.createElement('button');yes.textContent='リセットして新しい台';yes.onclick=()=>{el('toast').classList.remove('show');newMachine()};const no=document.createElement('button');no.textContent='この台を続ける';no.className='no';no.onclick=()=>el('toast').classList.remove('show');a.append(yes,no)}else{const ok=document.createElement('button');ok.textContent='続ける';ok.onclick=()=>el('toast').classList.remove('show');a.append(ok)}el('toast').classList.add('show')}
function saveSession(){const key='kanpa_history_v2';const h=JSON.parse(localStorage.getItem(key)||'[]');h.unshift({t:Date.now(),s:state.setting,g:state.games,a:state.a,b:state.b,r:state.r,q:state.guesses.length});localStorage.setItem(key,JSON.stringify(h.slice(0,50)));renderHistory()}
function renderHistory(){const h=JSON.parse(localStorage.getItem('kanpa_history_v2')||'[]');el('histBody').innerHTML=h.length?h.map(x=>`<tr><td>${new Date(x.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${x.s}</td><td>${x.g}</td><td>${x.a}</td><td>${x.b}</td><td>${x.r}</td><td>${x.q}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">履歴なし</td></tr>'}
function ac(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}function tone(f,d,v=.05,delay=0){const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(c.destination);const t=c.currentTime+delay;o.start(t);o.stop(t+d)}
function fanfare(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,.08,i*.12))}function beepMiss(){tone(160,.18,.07);tone(120,.28,.06,.15)}function beepReg(){tone(440,.08,.04);tone(660,.10,.04,.09)}function beepBonus(){tone(660,.08,.05);tone(880,.08,.05,.08);tone(1320,.12,.05,.16)}
el('startBtn').onclick=play;el('clearHist').onclick=()=>{if(confirm('設定履歴をすべて消しますか？')){localStorage.removeItem('kanpa_history_v2');renderHistory()}};
buildStrips();buildGuessButtons();initProbTable();renderHistory();newMachine();
</script>
</body></html>
